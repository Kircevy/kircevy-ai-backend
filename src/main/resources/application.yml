spring:
  application:
    name: kircevy-ai-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kircevy-ai
    username: xxx
    password: xxx
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      database: 12
      password:
      ttl: 3600
  profiles:
    active: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 512MB
      max-request-size: 512MB
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.wgz.aikir.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# AI 模型配置
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: xxx
      model-name: deepseek-chat
#      strict-json-schema: true
#      response-format: json_object
      max-tokens: 8192
      # M2 会一次性接收完整文件包，不能使用同步客户端的默认短读超时。
      timeout: PT15M
      # 超时重试会重复提交大型生成请求，交由上层按任务语义决定是否重试。
      max-retries: 0
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: xxx
      model-name: deepseek-chat
      max-tokens: 8192
      timeout: PT15M
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: <Your API Key>
      model-name: deepseek-reasoner
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: <Your API Key>
      model-name: qwen-turbo
      max-tokens: 100
      timeout: PT3M
      max-retries: 0
      log-requests: true
      log-responses: true

# 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: xxx
    secretId: xxx
    secretKey: xxx
    region: xxx
    bucket: xxx

# Pexels 图片搜索配置
pexels:
  api-key: <Your API Key>

# 阿里云 DashScope 配置
dashscope:
  api-key: <Your API Key>
  image-model: wanx2.0-t2i-turbo

# 暴露监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

# 二阶段 M0：默认关闭，确保一阶段生成路径保持不变。
multi-agent:
  enabled: false
  fullstack-only: true
  planning-enabled: false
  execution-enabled: false
